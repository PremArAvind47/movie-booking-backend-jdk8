server.port=8082

# change it, then POST /actuator/refresh
booking.max-seats-per-booking=6

# every Feign call goes through a circuit breaker
spring.cloud.openfeign.circuitbreaker.enabled=true
# ms: give up connecting after 1 s
spring.cloud.openfeign.client.config.default.connect-timeout=1000
# ms: give up waiting for the answer after 2 s
spring.cloud.openfeign.client.config.default.read-timeout=2000

# ---- circuit breaker rules (Resilience4j reads these keys; there is no Java config class) ----
# look at the last 10 calls
resilience4j.circuitbreaker.configs.default.slidingWindowSize=10
# but judge only after at least 5 calls
resilience4j.circuitbreaker.configs.default.minimumNumberOfCalls=5
# open the circuit when 50% of those calls failed
resilience4j.circuitbreaker.configs.default.failureRateThreshold=50
# stay open for 10 s, then test with a few calls
resilience4j.circuitbreaker.configs.default.waitDurationInOpenState=10s
# how many real calls are let through as a test
resilience4j.circuitbreaker.configs.default.permittedNumberOfCallsInHalfOpenState=2
# a business answer such as "not enough seats" is not a failure of the other service
resilience4j.circuitbreaker.configs.default.ignoreExceptions[0]=com.example.cinema.platform.ApiException
# one call (with its retry) may take 5 s at most
resilience4j.timelimiter.configs.default.timeoutDuration=5s
