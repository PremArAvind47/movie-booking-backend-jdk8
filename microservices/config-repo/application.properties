# Shared by every service (config server serves this file to all clients).
# NOTE: in a .properties file a comment must be on its own line (a # after a value becomes part of the value).

eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka}
# DEMO: see new services quickly
eureka.client.registry-fetch-interval-seconds=5
# DEMO: a new service shows up in about 5 s (default is 40 s)
eureka.client.initial-instance-info-replication-interval-seconds=5
eureka.instance.prefer-ip-address=true
# DEMO: heartbeat every 5 s
eureka.instance.lease-renewal-interval-in-seconds=5
eureka.instance.lease-expiration-duration-in-seconds=15

management.endpoints.web.exposure.include=health,info,refresh
# /actuator/health/liveness and /readiness
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never

# finish running requests before stopping
server.shutdown=graceful

spring.lifecycle.timeout-per-shutdown-phase=20s
# DEMO: forget a dead instance after 5 s (default is 35 s)
spring.cloud.loadbalancer.cache.ttl=5s

# every log line shows the request id
logging.pattern.level=%5p [%X{requestId:-none}]
