server.port=8080

# ms
spring.cloud.gateway.server.webflux.httpclient.connect-timeout=2000
# a service that does not answer in 10 s gives a 504
spring.cloud.gateway.server.webflux.httpclient.response-timeout=10s

# Retry ONLY GET requests (reading is safe to repeat). Never POST: a repeated booking could book twice.
spring.cloud.gateway.server.webflux.default-filters[0].name=Retry
spring.cloud.gateway.server.webflux.default-filters[0].args.retries=2
spring.cloud.gateway.server.webflux.default-filters[0].args.methods=GET
spring.cloud.gateway.server.webflux.default-filters[0].args.series=SERVER_ERROR
spring.cloud.gateway.server.webflux.default-filters[0].args.exceptions=java.io.IOException, java.util.concurrent.TimeoutException

# ONLY these two public APIs are exposed. "lb://name" = find the service in Eureka and
# spread the calls over all running copies.
# /api/v1/reservations and /api/v1/payments are INTERNAL: there is no route, so they are not reachable from outside.
spring.cloud.gateway.server.webflux.routes[0].id=movies
spring.cloud.gateway.server.webflux.routes[0].uri=lb://movie-service
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/v1/movies/**
spring.cloud.gateway.server.webflux.routes[1].id=bookings
spring.cloud.gateway.server.webflux.routes[1].uri=lb://booking-service
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/v1/bookings/**

# the gateway writes the request id inside the message (the log context is not used in reactive code)
logging.pattern.level=%5p
