spring.application.name=config-server
# read the settings from a folder (a real company uses a Git repository)
spring.profiles.active=native
# run from the microservices/ folder; in Docker the folder is mounted at /config-repo
spring.cloud.config.server.native.search-locations=${CONFIG_REPO_PATH:file:./config-repo/}

server.port=8888
server.shutdown=graceful

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
