spring:
  application:
    name: config-server
  profiles:
    active: native          # read the settings from a folder (a real company uses a Git repository)
  cloud:
    config:
      server:
        native:
          # run from the microservices/ folder; in Docker the folder is mounted at /config-repo
          search-locations: ${CONFIG_REPO_PATH:file:./config-repo/}

server:
  port: 8888
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
