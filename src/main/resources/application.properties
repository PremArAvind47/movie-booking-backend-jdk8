spring.application.name=movie-booking

spring.ai.ollama.base-url=http://localhost:11434
spring.ai.ollama.chat.model=llama3.2
spring.ai.ollama.embedding.model=nomic-embed-text

# Log folder (used by logback-spring.xml). Override with the LOG_PATH environment variable.
logging.file.path=${LOG_PATH:./logs}

# RAG settings (Part 8): how many chunks to send, and how close a chunk must be (0 to 1)
rag.top-k=2
rag.min-score=0.5
