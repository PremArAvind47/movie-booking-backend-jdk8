spring.application.name=movie-booking

spring.ai.ollama.base-url=${OLLAMA_URL:http://localhost:11434}
spring.ai.ollama.chat.model=qwen2.5:7b
spring.ai.ollama.embedding.model=nomic-embed-text

# Log folder (used by logback-spring.xml). Override with the LOG_PATH environment variable.
logging.file.path=${LOG_PATH:./logs}

# RAG settings (Part 8): how many chunks to send, and how close a chunk must be (0 to 1)
rag.top-k=2
rag.min-score=0.5

# in cmd to start ollama serve : ollama serve

# Memory settings (Part 9): how many recent messages each conversation remembers
# Not used now: MemoryConfig is switched off, so Spring AI's own default memory (last 20 messages) is used.
# memory.max-messages=10

# Image reading (Part 12): the model that can see, and the biggest picture we accept
vision.model=qwen2.5vl:3b
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Guardrails (Part 14): the longest question we accept, and show the reason when a request is rejected
guard.max-length=300
spring.web.error.include-message=always

# Observability (Part 16): show the health page and the numbers (metrics) at /actuator
management.endpoints.web.exposure.include=health,metrics

# Performance (Part 17): how many answers the cache keeps
cache.max-entries=100

# Cost (Part 18): EXAMPLE prices in dollars per 1 million tokens for a paid cloud model.
# Our local model is free; these numbers only show what the same call WOULD cost. Check the real price list.
cost.input-per-million-tokens=3.00
cost.output-per-million-tokens=15.00

# Production (Part 21): settings come from environment variables, with a default for local work.
# OLLAMA_URL = where Ollama runs (line 3). Timeouts: stop waiting for a model that does not answer.
# The read timeout must be longer than a slow model call (a cold model took 66 s here).
spring.http.clients.connect-timeout=${HTTP_CONNECT_TIMEOUT:5s}
spring.http.clients.read-timeout=${HTTP_READ_TIMEOUT:180s}

# Spring AI repeats a failed model call. The default is 10 attempts with growing waits (2 s, 10 s, 50 s...),
# so a hung model could keep one request busy for many minutes. 2 attempts is enough here.
spring.ai.retry.max-attempts=2
spring.ai.retry.backoff.initial-interval=1000ms
